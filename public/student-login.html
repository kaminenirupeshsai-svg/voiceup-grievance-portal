<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Student Login — VoiceUp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      var t = localStorage.getItem("theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-icon"><i class="bi bi-mortarboard"></i></div>
      <h2>Student Login</h2>
      <p class="lead">Access your dashboard &amp; track complaints</p>

      <form method="POST" action="/auth/login-student">
        <div class="form-row">
          <label>Email</label>
          <input name="email" type="email" placeholder="student@college.edu" required>
        </div>
        <div class="form-row">
          <label>Password</label>
          <input name="password" type="password" placeholder="Enter password" required>
        </div>
        <button class="btn" type="submit">Login</button>
      </form>

      <p style="text-align:center;font-size:13.5px;color:var(--muted);margin-top:16px">
        New here? <a href="/register.html" style="color:var(--primary);font-weight:600;text-decoration:none">Create an account</a>
      </p>

      <a class="auth-back" href="/">← Back to Home</a>
    </div>
  </div>
</body>
</html>
