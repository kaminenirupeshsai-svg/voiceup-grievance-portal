<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register — VoiceUp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      var t = localStorage.getItem("theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card" style="max-width:560px">
      <div class="auth-icon"><i class="bi bi-person-plus"></i></div>
      <h2>Create Student Account</h2>
      <p class="lead">Register to submit and track your grievances</p>

      <form method="POST" action="/auth/register" id="registerForm">
        <div class="form-grid">
          <div>
            <div class="form-row">
              <label for="name">Full name</label>
              <input id="name" name="name" type="text" placeholder="Your name" required>
            </div>
            <div class="form-row">
              <label for="roll">Roll Number (this will be your login ID)</label>
              <input id="roll" name="roll" type="text" placeholder="eg: CS2201" required>
            </div>
            <div class="form-row">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" placeholder="your.email@college.edu" required>
            </div>
            <div class="form-row">
              <label for="mobile">Mobile Number</label>
              <input id="mobile" name="mobile" type="tel" placeholder="10-digit mobile" pattern="[0-9]{10}" required>
            </div>
          </div>
          <div>
            <div class="form-row">
              <label for="dept">Department</label>
              <input id="dept" name="department" type="text" placeholder="CSE, ECE..." required>
            </div>
            <div class="form-row">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" required>
            </div>
            <div class="form-row">
              <label for="confirm">Confirm Password</label>
              <input id="confirm" name="confirm_password" type="password" required>
            </div>
          </div>
        </div>

        <button class="btn" type="submit">Create Account</button>
      </form>

      <a href="/" class="auth-back">← Back to Home</a>
    </div>
  </div>

  <script>
    document.getElementById("registerForm").addEventListener("submit", function (e) {
      var pass = document.getElementById("password").value;
      var confirm = document.getElementById("confirm").value;
      if (pass !== confirm) {
        e.preventDefault();
        alert("Passwords do not match.");
      }
    });
  </script>
</body>
</html>
